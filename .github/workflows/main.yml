name: Ejecutar Script de Pandas

# Aquí definimos los "event triggers" (Los activadores)
on:
  push:
    branches: [ "main" ]  # Se activa automáticamente al subir cambios a la rama main
  workflow_dispatch:      # Permite activar el workflow de forma manual con un botón

jobs:
  ejecutar-python:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el repositorio de GitHub
      uses: actions/checkout@v4

    - name: Configurar la versión de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Pandas y lectores de HTML
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests lxml bs4 html5lib yfinance

    - name: Ejecutar el script
      run: python tu_script.py  # <-- CAMBIA ESTO por el nombre real de tu archivo de Python
